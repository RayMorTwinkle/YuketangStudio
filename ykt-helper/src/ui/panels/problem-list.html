<div id="ykt-problem-list-panel" class="ykt-panel">
  <style>
    #ykt-problem-list-panel { display:flex; flex-direction:column; }
    #ykt-problem-list-panel .panel-header { display:flex; align-items:center; gap:8px; }
    #ykt-problem-list-panel .panel-header h3 { margin:0; flex:1; font-size:15px; }
    #ykt-problem-list-panel .pl-filter { font-size:12px; border:1px solid var(--ykt-border-strong,#ccc); border-radius:6px; padding:4px 6px; background:#fff; }
    #ykt-problem-list-panel .panel-body { flex:1; min-height:0; overflow-y:auto; padding:10px 12px; }
    .pl-empty { text-align:center; color:#607190; padding:40px 0; font-size:13px; }
    .pl-row { border:1px solid #e5e7eb; border-radius:8px; padding:10px 12px; margin-bottom:8px; background:#fff; }
    .pl-row.done { opacity:.62; }
    .pl-row.expired { border-color:#f0c9c9; }
    .pl-title { font-size:13px; font-weight:600; color:#1f2937; margin-bottom:4px; line-height:1.4; }
    .pl-meta { font-size:11px; color:#607190; margin-bottom:8px; display:flex; flex-wrap:wrap; gap:6px; align-items:center; }
    .pl-badge { display:inline-block; padding:1px 7px; border-radius:9px; font-size:11px; }
    .pl-badge.todo { background:#fff7ed; color:#c2410c; }
    .pl-badge.done { background:#f0fdf4; color:#15803d; }
    .pl-badge.expired { background:#fef2f2; color:#b91c1c; }
    .pl-actions { display:flex; gap:6px; flex-wrap:wrap; }
    .pl-actions button { padding:5px 12px; border:1px solid #d5dbe7; border-radius:6px; background:#f7f8fa; cursor:pointer; font-size:12px; }
    .pl-actions button:hover { border-color:#1d63df; color:#1d63df; }
    .pl-actions button.primary { background:#1d63df; border-color:#1d63df; color:#fff; }
    .pl-actions button.primary:hover { background:#1750b8; }
    .pl-actions button.danger { color:#b91c1c; }
    .pl-editor { margin-top:8px; border-top:1px dashed #e5e7eb; padding-top:8px; }
    .pl-editor .pl-hint { font-size:11px; color:#8a94a6; margin-bottom:6px; }
    .pl-editor textarea { width:100%; box-sizing:border-box; border:1px solid #d5dbe7; border-radius:6px; padding:8px; font-size:13px; font-family:inherit; resize:vertical; min-height:56px; }
    .pl-editor input[type="text"] { width:100%; box-sizing:border-box; border:1px solid #d5dbe7; border-radius:6px; padding:8px; font-size:14px; height:38px; }
    .pl-editor .pl-submitbar { display:flex; gap:8px; margin-top:8px; align-items:center; flex-wrap:wrap; }
    .pl-editor .pl-submitbar button { padding:7px 16px; border-radius:6px; border:1px solid #d5dbe7; background:#f7f8fa; cursor:pointer; font-size:13px; }
    .pl-editor .pl-submitbar button.primary { background:#1d63df; border-color:#1d63df; color:#fff; font-weight:600; }
    .pl-editor .pl-submitbar button.danger { border-color:#f0c9c9; color:#b91c1c; }
    .pl-editor .pl-answered { font-size:12px; color:#15803d; }
    /* 确认小弹窗（补交二次确认） */
    .pl-confirm-mask { position:fixed; inset:0; background:rgba(0,0,0,.4); z-index:99999999; display:flex; align-items:center; justify-content:center; padding:16px; box-sizing:border-box; }
    .pl-confirm-box { background:#fff; border-radius:10px; max-width:360px; width:100%; padding:18px; font-size:13px; box-shadow:0 10px 40px rgba(0,0,0,.25); }
    .pl-confirm-box .pl-confirm-actions { display:flex; gap:8px; margin-top:14px; }
    .pl-confirm-box .pl-confirm-actions button { flex:1; padding:8px; border-radius:6px; cursor:pointer; font-size:13px; }
    .pl-confirm-box .btn-ok { background:#b91c1c; color:#fff; border:none; font-weight:600; }
    .pl-confirm-box .btn-no { background:#f7f8fa; border:1px solid #d5dbe7; }
    @media (max-width:560px){ .pl-actions button{ min-height:36px; } }
  </style>
  <div class="panel-header">
    <h3>题目列表</h3>
    <select id="ykt-pl-filter" class="pl-filter">
      <option value="all">全部题目</option>
      <option value="todo">未作答</option>
      <option value="done">已作答</option>
      <option value="expired">已过期</option>
    </select>
    
  </div>
  <div class="panel-body" id="ykt-problem-list"></div>
</div>
