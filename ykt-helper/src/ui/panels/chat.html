<div id="ykt-chat-panel" class="ykt-panel">
  <style>
    #ykt-chat-panel { display: none; flex-direction: column; }
    #ykt-chat-panel.visible { display: flex; }
    #ykt-chat-panel .panel-header { display: flex; align-items: center; gap: 8px; }
    #ykt-chat-panel .panel-header h3 { margin: 0; flex: 1; }
    #ykt-chat-log { flex: 1; overflow-y: auto; padding: 10px; display: flex; flex-direction: column; gap: 10px; min-height: 240px; max-height: 52vh; }
    .ykt-chat-msg { max-width: 92%; border-radius: 10px; padding: 8px 10px; font-size: 13px; line-height: 1.55; }
    .ykt-chat-msg.user { align-self: flex-end; background: #1d63df; color: #fff; border-bottom-right-radius: 2px; }
    .ykt-chat-msg.user img { max-width: 220px; max-height: 130px; border-radius: 6px; display: block; margin-top: 6px; }
    .ykt-chat-msg.ai { align-self: flex-start; background: #f2f4f8; color: var(--ykt-fg, #222); border-bottom-left-radius: 2px; }
    .ykt-chat-msg.ai p { margin: 0 0 6px; }
    .ykt-chat-msg.ai p:last-child { margin-bottom: 0; }
    .ykt-chat-msg.ai details { margin-bottom: 6px; }
    .ykt-chat-msg.ai summary { cursor: pointer; color: #607190; font-size: 12px; user-select: none; }
    .ykt-chat-msg.ai .reasoning-body { color: #607190; font-size: 12px; white-space: pre-wrap; border-left: 3px solid #d8dee9; padding-left: 8px; margin: 4px 0; max-height: 160px; overflow-y: auto; }
    #ykt-chat-ctx { padding: 4px 10px; font-size: 12px; color: #607190; display: flex; align-items: center; gap: 8px; }
    #ykt-chat-ctx img { height: 34px; border-radius: 4px; border: 1px solid #ddd; }
    .ykt-chat-inputbar { display: flex; gap: 6px; padding: 8px 10px; border-top: 1px solid var(--ykt-border, #ddd); align-items: flex-end; }
    #ykt-chat-input { flex: 1; resize: none; font-size: 13px; padding: 6px 8px; border: 1px solid var(--ykt-border-strong, #ccc); border-radius: 6px; font-family: inherit; }
    #ykt-chat-input:focus { outline: none; border-color: var(--ykt-accent, #1d63df); }
    #ykt-chat-send { padding: 7px 14px; border: none; border-radius: 6px; background: var(--ykt-accent, #1d63df); color: #fff; cursor: pointer; }
    #ykt-chat-send:disabled { opacity: .5; cursor: not-allowed; }
    #ykt-chat-clear { padding: 3px 8px; font-size: 12px; }
    .ykt-chat-msg.ai .err { color: #c0392b; }
    .ykt-chat-msg .muted { color: #607190; font-size: 12px; }
    .ykt-chat-msg.user .ykt-chat-warn { margin-top: 6px; font-size: 12px; background: rgba(255,255,255,.18); border-radius: 4px; padding: 3px 6px; }
  </style>
  <div class="panel-header">
    <h3>💬 PPT 对话</h3>
    <button id="ykt-chat-clear">清空会话</button>
    <span class="close-btn" id="ykt-chat-close"><i class="fas fa-times"></i></span>
  </div>
  <div class="panel-body" style="display:flex;flex-direction:column;padding:0;">
    <div id="ykt-chat-log"></div>
    <div id="ykt-chat-ctx"><label><input type="checkbox" id="ykt-chat-attach" checked> 每条消息附带当前 PPT 页</label><span id="ykt-chat-ctx-thumb"></span></div>
    <div class="ykt-chat-inputbar">
      <textarea id="ykt-chat-input" rows="2" placeholder="问点什么…（Enter 发送，Shift+Enter 换行）"></textarea>
      <button id="ykt-chat-send">发送</button>
    </div>
  </div>
</div>
