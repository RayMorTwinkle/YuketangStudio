<div id="ykt-shell-panel" class="ykt-panel ykt-shell">
  <style>
    #ykt-shell-panel { display: none; flex-direction: column;
      width: min(760px, calc(100vw - 48px));       /* 窄窗口不溢出 */
      height: min(78vh, calc(100vh - 140px));      /* 留出工具栏与边距 */
      max-height: calc(100vh - 120px);
      padding: 0; }
    #ykt-shell-panel.visible { display: flex; }
    .ykt-shell-header { display: flex; align-items: center; padding: 10px 14px; border-bottom: 1px solid var(--ykt-border, #ddd); }
    .ykt-shell-header .shell-title { font-weight: 600; font-size: 14px; color: var(--ykt-accent, #1d63df); flex: 1; }
    .ykt-shell-header .shell-close { cursor: pointer; color: #607190; padding: 2px 6px; }
    .ykt-shell-header .shell-close:hover { color: #222; }
    .ykt-shell-body { flex: 1; display: flex; min-height: 0; }
    .ykt-shell-tabs { width: 118px; border-right: 1px solid var(--ykt-border, #ddd); padding: 8px 6px; display: flex; flex-direction: column; gap: 2px; background: #f7f9fc; }
    .ykt-shell-tab { display: flex; align-items: center; gap: 8px; padding: 9px 10px; border-radius: 8px; cursor: pointer; color: #44506b; font-size: 13px; user-select: none; }
    .ykt-shell-tab:hover { background: #eaeffa; }
    .ykt-shell-tab.active { background: var(--ykt-accent, #1d63df); color: #fff; }
    .ykt-shell-tab i { width: 16px; text-align: center; }
    .ykt-shell-content { flex: 1; overflow: hidden; position: relative; display: flex; }
    /* 迁移进来的原面板：从 fixed 弹窗变为 tab 内容。
       display 交给面板自身规则（chat 需 flex，其余 block），shell 只负责： */
    #ykt-shell-content > .ykt-panel {
      position: static !important;
      width: 100% !important; max-height: none !important; height: 100% !important;
      border: none !important; box-shadow: none !important; border-radius: 0 !important;
      overflow: hidden;               /* 滚动交给内部区域，避免双层滚动条 */
    }
    /* 对话类面板：log 区在 shell 内撑满可用高度，消除底部空白 */
    #ykt-shell-content #ykt-chat-log,
    #ykt-shell-content #ykt-ai-log { flex: 1 1 auto; max-height: none; min-height: 120px; }
    #ykt-shell-content #ykt-chat-panel .panel-body,
    #ykt-shell-content #ykt-ai-answer-panel .panel-body { flex: 1; min-height: 0; }
    /* 课件面板在 shell 内填满：两列各自滚动，不再受独立弹窗的 72vh 限制 */
    #ykt-shell-content #ykt-presentation-panel .panel-body { height: 100%; grid-template-columns: minmax(220px, 300px) 1fr; }
    #ykt-shell-content #ykt-presentation-panel .panel-left,
    #ykt-shell-content #ykt-presentation-panel .panel-right { max-height: none; height: 100%; overflow: auto; position: static; }
    #ykt-shell-content #ykt-presentation-panel .slide-view { max-height: none; height: auto; min-height: 240px; }
    /* 设置面板在 shell 内整体滚动 */
    #ykt-shell-content #ykt-settings-panel { overflow: auto; }
    /* 非当前 tab 的面板无条件隐藏（压过面板自身 ID 样式） */
    #ykt-shell-content > .ykt-panel:not(.active-tab) { display: none !important; }
  </style>
  <div class="ykt-shell-header">
    <span class="shell-title"><i class="fas fa-briefcase"></i> YuketangStudio</span>
    <span class="shell-close" id="ykt-shell-close"><i class="fas fa-times"></i></span>
  </div>
  <div class="ykt-shell-body">
    <div class="ykt-shell-tabs" id="ykt-shell-tabs"></div>
    <div class="ykt-shell-content" id="ykt-shell-content"></div>
  </div>
</div>
