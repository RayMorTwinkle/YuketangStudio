<div id="ykt-ai-answer-panel" class="ykt-panel">
  <style>
    #ykt-ai-answer-panel { display: none; flex-direction: column; }
    #ykt-ai-answer-panel.visible { display: flex; }
    #ykt-ai-answer-panel .panel-header { display: flex; align-items: center; gap: 8px; }
    #ykt-ai-answer-panel .panel-header h3 { margin: 0; flex: 1; }
    #ykt-ai-log { flex: 1; overflow-y: auto; padding: 10px; display: flex; flex-direction: column; gap: 10px; min-height: 200px; max-height: 44vh; }
    .ykt-ai-msg { max-width: 92%; border-radius: 10px; padding: 8px 10px; font-size: 13px; line-height: 1.55; }
    .ykt-ai-msg.user { align-self: flex-end; background: #1d63df; color: #fff; border-bottom-right-radius: 2px; }
    .ykt-ai-msg.user img { max-width: 220px; max-height: 130px; border-radius: 6px; display: block; margin-top: 6px; }
    .ykt-ai-msg.ai { align-self: flex-start; background: #f2f4f8; color: var(--ykt-fg, #222); border-bottom-left-radius: 2px; }
    .ykt-ai-msg.ai p { margin: 0 0 6px; }
    .ykt-ai-msg.ai p:last-child { margin-bottom: 0; }
    .ykt-ai-msg.ai details { margin-bottom: 6px; }
    .ykt-ai-msg.ai summary { cursor: pointer; color: #607190; font-size: 12px; user-select: none; }
    .ykt-ai-msg.ai .reasoning-body { color: #607190; font-size: 12px; white-space: pre-wrap; border-left: 3px solid #d8dee9; padding-left: 8px; margin: 4px 0; max-height: 160px; overflow-y: auto; }
    .ykt-ai-msg .err { color: #c0392b; }
    .ykt-ai-msg .muted { color: #607190; font-size: 12px; }
    .ykt-ai-msg.user .ykt-chat-warn { margin-top: 6px; font-size: 12px; background: rgba(255,255,255,.18); border-radius: 4px; padding: 3px 6px; }
    #ykt-ai-ctx { padding: 4px 10px; font-size: 12px; color: #607190; display: flex; align-items: center; gap: 8px; border-top: 1px solid var(--ykt-border, #ddd); }
    #ykt-ai-ctx img { height: 34px; border-radius: 4px; border: 1px solid #ddd; }
    #ykt-ai-ctx .ctx-status { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    #ykt-ai-custom { display: flex; gap: 6px; padding: 4px 10px; align-items: center; }
    #ykt-ai-custom input { flex: 1; font-size: 12px; padding: 4px 8px; border: 1px solid var(--ykt-border-strong, #ccc); border-radius: 6px; }
    .ykt-ai-inputbar { display: flex; gap: 6px; padding: 8px 10px; border-top: 1px solid var(--ykt-border, #ddd); align-items: flex-end; }
    #ykt-ai-input { flex: 1; resize: none; font-size: 13px; padding: 6px 8px; border: 1px solid var(--ykt-border-strong, #ccc); border-radius: 6px; font-family: inherit; }
    #ykt-ai-input:focus { outline: none; border-color: var(--ykt-accent, #1d63df); }
    #ykt-ai-send { padding: 7px 14px; border: none; border-radius: 6px; background: var(--ykt-accent, #1d63df); color: #fff; cursor: pointer; white-space: nowrap; }
    #ykt-ai-send:disabled { opacity: .5; cursor: not-allowed; }
    #ykt-ai-clear { padding: 3px 8px; font-size: 12px; }
  </style>
  <div class="panel-header">
    <h3>🤖 AI 解答</h3>
    <button id="ykt-ai-clear">清空会话</button>
    <span class="close-btn" id="ykt-ai-close"><i class="fas fa-times"></i></span>
  </div>
  <div class="panel-body" style="display:flex;flex-direction:column;padding:0;">
    <div id="ykt-ai-log"></div>
    <div id="ykt-ai-ctx">
      <label><input type="checkbox" id="ykt-ai-attach" checked> 附带当前页</label>
      <span class="ctx-status" id="ykt-ai-text-status">正在检测页面信息...</span>
      <span id="ykt-ai-ctx-thumb"></span>
    </div>
    <div id="ykt-ai-custom">
      <input type="text" id="ykt-ai-custom-prompt" placeholder="自定义要求（可选，每轮生效）：如「只给思路不给答案」">
    </div>
    <div class="ykt-ai-inputbar">
      <textarea id="ykt-ai-input" rows="2" placeholder="留空发送 = 解答此页题目；输入内容 = 针对题目追问（Enter 发送）"></textarea>
      <button id="ykt-ai-send">发送</button>
    </div>
  </div>
</div>
