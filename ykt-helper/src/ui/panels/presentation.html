<div id="ykt-presentation-panel" class="ykt-panel">
  <style>
    #ykt-presentation-panel .slide-thumb.active {
      outline: 2px solid #3b82f6;
      outline-offset: 2px;
    }
    .pdf-progress {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 6px 12px;
      background: #f0f4ff;
      border-radius: 6px;
      margin-top: 6px;
    }
    .pdf-progress-bar {
      flex: 1;
      height: 8px;
      background: #dbeafe;
      border-radius: 4px;
      overflow: hidden;
    }
    .pdf-progress-fill {
      height: 100%;
      width: 0%;
      background: linear-gradient(90deg, #3b82f6, #6366f1);
      border-radius: 4px;
      transition: width 0.2s ease;
    }
    .pdf-progress-text {
      font-size: 12px;
      font-weight: 600;
      color: #3b82f6;
      min-width: 36px;
      text-align: right;
    }
    /* 题目页筛选开关 / 跟随当前页开关 */
    #ykt-filter-problems,
    #ykt-follow-current {
      border: 1px solid var(--ykt-border-strong, #ccc);
      background: #f7f8fa;
      border-radius: 6px;
      cursor: pointer;
      padding: 4px 10px;
      font-size: 12px;
      color: var(--ykt-fg, #222);
    }
    #ykt-filter-problems.active,
    #ykt-follow-current.active {
      background: #1d63df;
      border-color: #1d63df;
      color: #fff;
    }
  </style>
  <div class="panel-header">
    <h3>课件查看</h3>
    <div class="panel-controls">
      <button id="ykt-follow-current" title="选中项自动跟随课堂翻页；手动选择页面会脱离跟随">🎯 跟随当前页</button>
      <button id="ykt-filter-problems" title="只显示带题目的页面，再次点击恢复全部">📝 只看题目页</button>
      <button id="ykt-download-pdf">整册下载(PDF)</button>
      <button id="ykt-import-history" title="从历史课堂报告导入课件并导出 PDF">📥 历史课件</button>
      <span class="close-btn" id="ykt-presentation-close"><i class="fas fa-times"></i></span>
    </div>
    <div id="ykt-pdf-progress" class="pdf-progress" style="display:none">
      <div class="pdf-progress-bar">
        <div id="ykt-pdf-progress-fill" class="pdf-progress-fill"></div>
      </div>
      <span id="ykt-pdf-progress-text" class="pdf-progress-text">0%</span>
      <button id="ykt-pdf-cancel" title="取消导出" style="border:none;background:none;color:#c0392b;cursor:pointer;font-size:13px;padding:0 2px;">✕</button>
    </div>
  </div>

  <div class="panel-body">
    <div class="panel-left">
      <div id="ykt-presentation-list" class="presentation-list"></div>
    </div>
    <div class="panel-right">
      <div id="ykt-slide-view" class="slide-view">
        <div class="slide-cover">
          <div class="empty-message">选择左侧的幻灯片查看详情</div>
        </div>
        <div id="ykt-problem-view" class="problem-view"></div>
      </div>
    </div>
  </div>
</div>
